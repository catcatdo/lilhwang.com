<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Parts Generator</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --txt:#e8ecf1; --muted:#9aa6bc; --acc:#3a7afe; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .wrap{max-width:1100px;margin:22px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
    h1,h2{margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .dropzone{min-height:200px;border:2px dashed #3b4352;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);cursor:pointer;position:relative}
    .dropzone.drag{border-color:var(--acc);background:rgba(58,122,254,.12)}
    .dropzone img{max-width:100%;max-height:220px;border-radius:8px;object-fit:contain}
    .hidden{display:none}
    label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#cdd6e3}
    input,select,button{border:1px solid #3b4352;background:#10131a;color:var(--txt);border-radius:8px;padding:9px}
    button{cursor:pointer}
    .primary{background:var(--acc);border-color:var(--acc);font-weight:600}
    .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .preview3d{height:400px;border:1px dashed #3b4352;border-radius:12px;background:#0b0d12}
    .small{font-size:12px;color:var(--muted)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9999}
    .overlay.show{display:flex}
    .loader{background:#131722;border:1px solid #2d3444;border-radius:14px;padding:18px 20px;min-width:280px;text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #2f3850;border-top-color:#7aa2ff;border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>간단 부품 제너레이터</h1>
    <p class="small">복잡한 모델링 대신, 바로 프린트 가능한 단순 부품(박스/원통/링/브라켓/플레이트) 생성용.</p>

    <div class="card">
      <h2>1) 사진 업로드 (선택)</h2>
      <div class="grid">
        <div>
          <div id="dropzone" class="dropzone">
            <input id="fileInput" class="hidden" type="file" accept="image/*" />
            <div id="dzText">여기로 사진을 드래그해서 놓거나 클릭해서 업로드</div>
            <img id="imgPreview" class="hidden" alt="preview" />
          </div>
        </div>
        <div>
          <div class="small" id="analysis">이미지를 올리면 대략 치수 추정(참고값)을 시도해.</div>
          <div class="row" style="margin-top:10px">
            <label>가로 W (mm)<input id="dimW" type="number" step="0.1" value="120" /></label>
            <label>세로 H (mm)<input id="dimH" type="number" step="0.1" value="80" /></label>
            <label>깊이 D (mm)<input id="dimD" type="number" step="0.1" value="40" /></label>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>2) 부품 타입/옵션</h2>
      <div class="row">
        <label>부품 타입
          <select id="partType">
            <option value="box">박스(Box)</option>
            <option value="cylinder">원통(Cylinder)</option>
            <option value="ring">링(Ring)</option>
            <option value="bracket">L 브라켓(Bracket)</option>
            <option value="plate">플레이트(Plate)</option>
          </select>
        </label>
        <label>두께/벽두께 (mm)<input id="thickness" type="number" step="0.1" value="3" /></label>
        <label>구멍 지름 (mm, 선택)<input id="hole" type="number" step="0.1" value="0" /></label>
      </div>

      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="generateBtn" class="primary">제너레이터 실행</button>
        <button id="wireBtn">와이어프레임 토글</button>
        <button id="saveJsonBtn">현재 설정 JSON 저장</button>
      </div>
    </div>

    <div class="card">
      <h2>3) 결과</h2>
      <div id="preview3d" class="preview3d"></div>
      <div id="resultText" class="small" style="margin-top:8px">아직 생성 전</div>
    </div>
  </div>

  <div id="loading" class="overlay">
    <div class="loader">
      <div class="spinner"></div>
      <div id="loadingText">제너레이터 실행 중...</div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const dz = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const img = document.getElementById('imgPreview');
    const dzText = document.getElementById('dzText');
    const analysis = document.getElementById('analysis');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');

    let wire = false;
    let renderer, scene, camera, mesh;

    function showLoading(msg){ loadingText.textContent = msg || '처리 중...'; loading.classList.add('show'); }
    function hideLoading(){ loading.classList.remove('show'); }

    function init3D(){
      if (renderer) return;
      const el = document.getElementById('preview3d');
      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(el.clientWidth, el.clientHeight);
      el.appendChild(renderer.domElement);
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0d12);
      camera = new THREE.PerspectiveCamera(50, el.clientWidth/el.clientHeight, 0.1, 5000);
      camera.position.set(200,160,240);
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const l = new THREE.DirectionalLight(0xffffff, 1.1); l.position.set(1,2,1); scene.add(l);
    }

    function roughEstimateFromImage(file){
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const i = new Image();
          i.onload = () => {
            // 아주 단순 추정: 긴 변 기준 120mm로 normalize
            const maxSide = Math.max(i.width, i.height);
            const scale = 120 / maxSide;
            const w = Math.max(10, i.width * scale);
            const h = Math.max(10, i.height * scale);
            const d = Math.max(8, Math.min(w, h) * 0.4);
            resolve({w,h,d,txt:`이미지 비율 기반 참고 추정: ${w.toFixed(1)} x ${h.toFixed(1)} x ${d.toFixed(1)} mm`});
          };
          i.src = reader.result;
          img.src = reader.result;
          img.classList.remove('hidden');
          dzText.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(file){
      showLoading('이미지 분석 중...');
      const est = await roughEstimateFromImage(file);
      document.getElementById('dimW').value = est.w.toFixed(1);
      document.getElementById('dimH').value = est.h.toFixed(1);
      document.getElementById('dimD').value = est.d.toFixed(1);
      analysis.textContent = est.txt + ' (자동값은 필요 시 수정해줘)';
      hideLoading();
    }

    dz.addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', ()=>{ const f=fileInput.files?.[0]; if(f) handleFile(f); });
    ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,(ev)=>{ev.preventDefault(); dz.classList.add('drag');}));
    ['dragleave','drop'].forEach(e=>dz.addEventListener(e,(ev)=>{ev.preventDefault(); dz.classList.remove('drag');}));
    dz.addEventListener('drop',(ev)=>{ const f=ev.dataTransfer?.files?.[0]; if(f) handleFile(f); });

    function buildGeometry(type, W,H,D,t,hole){
      if (type==='cylinder') return new THREE.CylinderGeometry(Math.max(W,D)/2, Math.max(W,D)/2, H, 48);
      if (type==='ring') {
        const outer = Math.max(W,D)/2, inner = Math.max(1, outer - Math.max(1,t));
        const shape = new THREE.Shape(); shape.absarc(0,0,outer,0,Math.PI*2,false);
        const holePath = new THREE.Path(); holePath.absarc(0,0,inner,0,Math.PI*2,true); shape.holes.push(holePath);
        return new THREE.ExtrudeGeometry(shape,{depth:H,bevelEnabled:false,steps:1});
      }
      if (type==='bracket') {
        const T = Math.max(1,t);
        const g1 = new THREE.BoxGeometry(W,T,H);
        const g2 = new THREE.BoxGeometry(T,D,H);
        g2.translate(-(W/2)+(T/2), (D/2)-(T/2), 0);
        g1.translate(0, -(D/2)+(T/2), 0);
        const m = THREE.BufferGeometryUtils ? THREE.BufferGeometryUtils.mergeGeometries([g1,g2]) : g1;
        return m;
      }
      if (type==='plate') {
        const T = Math.max(1,t);
        return new THREE.BoxGeometry(W,T,D);
      }
      return new THREE.BoxGeometry(W,H,D);
    }

    // tiny merge fallback (BufferGeometryUtils 없을 때 bracket은 단일 박스로 대체)
    function safeGeometry(type,W,H,D,t){
      if (type!=='bracket') return buildGeometry(type,W,H,D,t,0);
      return new THREE.BoxGeometry(W, Math.max(1,t), H);
    }

    function renderPart(){
      init3D();
      const W=Number(document.getElementById('dimW').value||120);
      const H=Number(document.getElementById('dimH').value||80);
      const D=Number(document.getElementById('dimD').value||40);
      const t=Number(document.getElementById('thickness').value||3);
      const hole=Number(document.getElementById('hole').value||0);
      const type=document.getElementById('partType').value;

      if (mesh) scene.remove(mesh);
      const geo = safeGeometry(type,W,H,D,t,hole);
      const mat = new THREE.MeshStandardMaterial({color:0x3a7afe, wireframe:wire});
      mesh = new THREE.Mesh(geo,mat);
      scene.add(mesh);
      camera.position.set(Math.max(W,D)*1.8, Math.max(H,D)*1.6, Math.max(W,H,D)*2.1);
      camera.lookAt(0,0,0);
      renderer.render(scene,camera);

      document.getElementById('resultText').textContent = `생성 완료: ${type} / ${W} x ${H} x ${D} mm / 두께 ${t}mm`;
    }

    document.getElementById('generateBtn').addEventListener('click', async ()=>{
      showLoading('제너레이터 실행 중...');
      await new Promise(r=>setTimeout(r,500));
      renderPart();
      hideLoading();
    });

    document.getElementById('wireBtn').addEventListener('click', ()=>{ wire=!wire; renderPart(); });

    document.getElementById('saveJsonBtn').addEventListener('click', ()=>{
      const payload={
        partType: document.getElementById('partType').value,
        dimensions_mm:{
          width:Number(document.getElementById('dimW').value||0),
          height:Number(document.getElementById('dimH').value||0),
          depth:Number(document.getElementById('dimD').value||0),
        },
        thickness_mm:Number(document.getElementById('thickness').value||0),
        hole_mm:Number(document.getElementById('hole').value||0),
        createdAt:new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='simple-part.json'; a.click();
      URL.revokeObjectURL(url);
    });

    // initial render
    init3D();
    renderPart();
  </script>
</body>
</html>
